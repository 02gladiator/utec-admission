services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://utec:${POSTGRES_PASSWORD}@postgres:5432/utec_admissions?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: ./frontend
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: utec_admissions
      POSTGRES_USER: utec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utec -d utec_admissions"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
