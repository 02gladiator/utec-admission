services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: utec_admissions
      POSTGRES_USER: utec
      POSTGRES_PASSWORD: utec_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utec -d utec_admissions"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://utec:utec_dev_password@postgres:5432/utec_admissions?sslmode=disable

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379

  node-exporter:
    image: prom/node-exporter:latest
    profiles: ["vps"]
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
